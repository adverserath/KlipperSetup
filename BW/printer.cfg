# This file contains common pin mappings for RAMPS (v1.3 and later)
# boards. RAMPS boards typically use a firmware compiled for the AVR
# atmega2560 (though other AVR chips are also possible).

# See the example.cfg file for a description of available parameters.

[stepper_x]
step_pin: ar54
dir_pin: !ar55
enable_pin: !ar38
#step_distance: .0125
microsteps: 16
rotation_distance: 40
endstop_pin: ^!ar3
#endstop_pin: ^ar2
position_endstop: 0
position_max: 400
homing_speed: 150

[stepper_y]
step_pin: ar60
dir_pin: ar61
enable_pin: !ar56
microsteps: 16
rotation_distance: 40
#step_distance: .0125
endstop_pin: ^!ar14
#endstop_pin: ^ar15
position_endstop: 0
position_max: 250
homing_speed: 150

[stepper_z]
step_pin: ar46
dir_pin: ar48
enable_pin: !ar62
#step_distance: .000625
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^ar19
#position_endstop: 3.3
position_max: 300
homing_speed: 3
position_min: -2.00

[extruder]
step_pin: ar26
dir_pin: !ar28
enable_pin: !ar24
#step_distance: .002255
microsteps: 16
gear_ratio: 5:1
#rotation_distance: 7.216 #More Extrusion
#rotation_distance: 7.785 #Less Extrusion
rotation_distance: 36.886 #(hobbed_diam * pi) 22.608 to 24.44804
nozzle_diameter: 0.500
filament_diameter: 1.750
heater_pin: ar10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog13
min_temp: 0
max_temp: 250
#pressure_advance: 0.105
pressure_advance: 0.05
max_extrude_only_distance: 1000
control = pid
pid_kp = 20.113
pid_ki = 0.667
pid_kd = 151.604

[heater_bed]
heater_pin: ar8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog14
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: ar9
#pin: ar6
#hardware_pwm: True

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AH05X6XD-if00-port0
#pin_map: arduino
baud: 250000

[board_pins arduino-mega]
aliases:
    ar0=PE0, ar1=PE1, ar2=PE4, ar3=PE5, ar4=PG5,
    ar5=PE3, ar6=PH3, ar7=PH4, ar8=PH5, ar9=PH6,
    ar10=PB4, ar11=PB5, ar12=PB6, ar13=PB7, ar14=PJ1,
    ar15=PJ0, ar16=PH1, ar17=PH0, ar18=PD3, ar19=PD2,
    ar20=PD1, ar21=PD0, ar22=PA0, ar23=PA1, ar24=PA2,
    ar25=PA3, ar26=PA4, ar27=PA5, ar28=PA6, ar29=PA7,
    ar30=PC7, ar31=PC6, ar32=PC5, ar33=PC4, ar34=PC3,
    ar35=PC2, ar36=PC1, ar37=PC0, ar38=PD7, ar39=PG2,
    ar40=PG1, ar41=PG0, ar42=PL7, ar43=PL6, ar44=PL5,
    ar45=PL4, ar46=PL3, ar47=PL2, ar48=PL1, ar49=PL0,
    ar50=PB3, ar51=PB2, ar52=PB1, ar53=PB0, ar54=PF0,
    ar55=PF1, ar56=PF2, ar57=PF3, ar58=PF4, ar59=PF5,
    ar60=PF6, ar61=PF7, ar62=PK0, ar63=PK1, ar64=PK2,
    ar65=PK3, ar66=PK4, ar67=PK5, ar68=PK6, ar69=PK7,
    analog0=PF0, analog1=PF1, analog2=PF2, analog3=PF3, analog4=PF4,
    analog5=PF5, analog6=PF6, analog7=PF7, analog8=PK0, analog9=PK1,
    analog10=PK2, analog11=PK3, analog12=PK4, analog13=PK5, analog14=PK6,
    analog15=PK7,
    # Marlin adds these additional aliases
    ml70=PG4, ml71=PG3, ml72=PJ2, ml73=PJ3, ml74=PJ7,
    ml75=PJ4, ml76=PJ5, ml77=PJ6, ml78=PE2, ml79=PE6,
    ml80=PE7, ml81=PD4, ml82=PD5, ml83=PD6, ml84=PH2,
    ml85=PH7
[gcode_arcs]

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 1600
#700
max_z_velocity: 10
max_z_accel: 100

[display]
lcd_type: st7920
cs_pin: ar16
sclk_pin: ar23
sid_pin: ar17
encoder_pins: ^ar31, ^ar33
click_pin: ^!ar35

# Define the BLTouch servo
[bltouch]
sensor_pin:ar18
#   Pin connected to the BLTouch sensor pin. This parameter must be
#   provided.
control_pin:ar11
#   Pin connected to the BLTouch control pin. This parameter must be
#   provided.
pin_move_time: 0.200
#   The amount of time (in seconds) that it takes the BLTouch pin to
#   move up or down. The default is 0.200 seconds.
x_offset:65
y_offset:10
#z_offset:3.350
speed:5
#maximum_servo_angle: 180
#minimum_pulse_width: 0.0006
#maximum_pulse_width: 0.0024

# If the BLTouch is used to home the Z axis, then define a homing_override section, use
#probe:z_virtual_endstop as the endstop_pin in the stepper_z section, and set the
#endstop_position in the stepper_z section to match the probe's z_offset.
[homing_override]
set_position_z: -5
axes: z
gcode:
   G90 ; Uncomment these 2 lines to blindly lift the Z 2mm at start
   G1 Z5 F600
   G1 X150 Y125 F2600
   G28 Z0

