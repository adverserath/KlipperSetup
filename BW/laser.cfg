[stepper_x]
step_pin: ar54
dir_pin: !ar55
enable_pin: !ar38
step_distance: .0125
endstop_pin: ^!ar3
#endstop_pin: ^ar2
position_endstop: 1
position_min: 0
position_max: 400
homing_speed: 150

[stepper_y]
step_pin: ar60
dir_pin: ar61
enable_pin: !ar56
step_distance: .0125
endstop_pin: ^!ar14
#endstop_pin: ^ar15
position_endstop: -25
position_min: -25
position_max: 250
homing_speed: 150

[stepper_z]
step_pin: ar46
dir_pin: ar48
enable_pin: !ar62
step_distance: .000625
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^ar19
#position_endstop: 3.3
position_max: 300
homing_speed: 5
position_min: -2.00

[heater_bed]
heater_pin: ar8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog14
control: watermark
min_temp: 0
max_temp: 130

[fan]
#pin: ar9
pin: ar6
hardware_pwm: True

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AH05X6XD-if00-port0
pin_map: arduino
baud: 250000

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 1500
max_z_velocity: 10
max_z_accel: 80

[display]
lcd_type: st7920
cs_pin: ar16
sclk_pin: ar23
sid_pin: ar17
encoder_pins: ^ar31, ^ar33
click_pin: ^!ar35

# Define the BLTouch servo
[bltouch]
sensor_pin:ar18
#   Pin connected to the BLTouch sensor pin. This parameter must be
#   provided.
control_pin:ar11
#   Pin connected to the BLTouch control pin. This parameter must be
#   provided.
pin_move_time: 0.200
#   The amount of time (in seconds) that it takes the BLTouch pin to
#   move up or down. The default is 0.200 seconds.
x_offset:62
y_offset:29
z_offset:3.6
speed:10
#maximum_servo_angle: 180
#minimum_pulse_width: 0.0006
#maximum_pulse_width: 0.0024

# If the BLTouch is used to home the Z axis, then define a homing_override section, use
#probe:z_virtual_endstop as the endstop_pin in the stepper_z section, and set the
#endstop_position in the stepper_z section to match the probe's z_offset.
[homing_override]
set_position_z: -10
axes: z
gcode:
   G28 X0
   G28 Y0
#   G0 Y0 F3600
   G90 ; Uncomment these 2 lines to blindly lift the Z 2mm at start
   G1 Z5 F600
   G1 X138 Y96 F3600
   G28 Z0
   G0 Z35
   G0 X200 Y125

[gcode_arcs]
resolution: 1.0

[idle_timeout]
timeout: 1200