[include mainsail.cfg]

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos = True
variable_custom_park_dz = 20.0
gcode = 

[stepper_x]
step_pin = PF13
dir_pin = PF12
enable_pin = !PF14
microsteps = 16
rotation_distance = 40
endstop_pin = tmc2209_stepper_x:virtual_endstop
homing_retract_dist = 0
position_endstop = -20
position_max = 320
position_min = -20
homing_speed = 30

[stepper_y]
step_pin = PG0
dir_pin = !PG1
enable_pin = !PF15
microsteps = 16
rotation_distance = 40
endstop_pin = tmc2209_stepper_y:virtual_endstop
homing_retract_dist = 0
position_endstop = 0
position_max = 210
position_min = 0
homing_speed = 30

[stepper_z]
step_pin = PF11
dir_pin = !PG3
enable_pin = !PG5
microsteps = 16
rotation_distance = 2
endstop_pin = probe:z_virtual_endstop
position_max = 300
position_min = -5

[extruder]
step_pin = PG4
dir_pin = PC1
enable_pin = !PA0
microsteps = 16
rotation_distance = 7.19
nozzle_diameter = 0.400
filament_diameter = 1.750
heater_pin = PA2
sensor_pin = PF4
sensor_type = NTC 100K MGB18-104F39050L32
min_temp = 0
max_temp = 250
pressure_advance = 0.05
max_extrude_only_distance = 100.0
control = pid
pid_kp = 16.877
pid_ki = 0.611
pid_kd = 116.454

[heater_bed]
heater_pin = PA3
sensor_pin = PF3
sensor_type = EPCOS 100K B57560G104F
control = watermark
min_temp = 0
max_temp = 90

[led box_light]
white_pin = PD13
initial_white = 0.2

[heater_fan fan1]
pin = PD14
heater = extruder
heater_temp = 50
fan_speed = 0.5

[controller_fan stepper_fan]
pin = PD12
fan_speed = 0.5
stepper = extruder, stepper_y, stepper_y, stepper_z

[fan]
pin = PD15

[mcu]
serial = /dev/serial/by-id/usb-Klipper_stm32f446xx_2A000E001950534841313020-if00

[force_move]
enable_force_move = True

[printer]
kinematics = cartesian
max_velocity = 150
max_accel = 800
max_z_velocity = 10
max_z_accel = 100

[tmc2209 stepper_x]
uart_pin = PC4
diag_pin = PG6
run_current = 1.00
driver_sgthrs = 55

[tmc2209 stepper_y]
uart_pin = PD11
diag_pin = PG9
run_current = 1.0
driver_sgthrs = 60

[tmc2209 stepper_z]
uart_pin = PC6
run_current = 0.900

[tmc2209 extruder]
uart_pin = PC7
run_current = 0.900

[board_pins]
aliases = 
	
	EXP1_1=PE8, EXP1_2=PE7,
	EXP1_3=PE9, EXP1_4=PE10,
	EXP1_5=PE12, EXP1_6=PE13,
	EXP1_7=PE14, EXP1_8=PE15,
	EXP1_9=<GND>, EXP1_10=<5V>,
	
	
	EXP2_1=PA6, EXP2_2=PA5,
	EXP2_3=PB1, EXP2_4=PA4,
	EXP2_5=PB2, EXP2_6=PA7,
	EXP2_7=PC15, EXP2_8=<RST>,
	EXP2_9=<GND>, EXP2_10=PC5

[display]
lcd_type = st7920
cs_pin = EXP1_4
sclk_pin = EXP1_5
sid_pin = EXP1_3
encoder_pins = ^EXP2_3, ^EXP2_5
click_pin = ^!EXP1_2

[output_pin beeper]
pin = EXP1_1

[bltouch]
sensor_pin = PB7
control_pin = PB6
pin_move_time = 0.200
x_offset = 65
y_offset = 10
speed = 5
z_offset = 3.400

[safe_z_home]
home_xy_position = 135, 95
speed = 100
z_hop = 10
z_hop_speed = 5

[exclude_object]

[gcode_arcs]
resolution = 0.1

[gcode_macro PRINT_END]
gcode = 
	M400
	G92 E0
	G1 E-10.0 F3600
	G91
	G0 Z5.00 X20.0 Y20.0 F20000
	TURN_OFF_HEATERS
	M107
	G1 Z5 F3000
	G90
	G0  X0 Y200 F3600

[gcode_macro SENSORLESS_HOME_X]
gcode = 
	{% set HOME_CUR = 0.600 %}
	{% set driver_config = printer.configfile.settings['tmc2209 stepper_x'] %}
	{% set RUN_CUR = driver_config.run_current %}
	
	SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
	
	G4 P2000
	
	G28 X0
	
	G90
	G1 X20 F1200
	
	SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}

[gcode_macro SENSORLESS_HOME_Y]
gcode = 
	{% set HOME_CUR = 0.600 %}
	{% set driver_config = printer.configfile.settings['tmc2209 stepper_y'] %}
	{% set RUN_CUR = driver_config.run_current %}
	
	SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
	
	G4 P2000
	
	G28 Y0
	
	G90
	G1 Y20 F1200
	
	SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR}

[gcode_macro UNSAFE_RAISE_TOOL]
description = Raise the toolhead 10mm without homing
gcode = 
	G90
	SET_KINEMATIC_POSITION Z=0
	G0 Z10 F600
	M84

[screws_tilt_adjust]
screw1 = 20, 0
screw1_name = front left screw
screw2 = 320, 0
screw2_name = front right screw
screw3 = 320, 210
screw3_name = rear right screw
screw4 = 20, 210
screw4_name = rear left screw
horizontal_move_z = 10.
speed = 50.
screw_thread = CW-M3